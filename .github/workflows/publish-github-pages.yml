name: Publish GitHub Pages

# Official GitHub Actions Pages deployment (upload artifact + deploy-pages).
# Repo Settings → Pages → Source must be "GitHub Actions".
#
# Manual only — Actions → Publish GitHub Pages → Run workflow. Landing a
# change on main no longer publishes by itself.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel stale in-flight deploys — fixes "Deployment failed, try again later"
# when multiple runs queue (actions/deploy-pages#418).
concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SPA artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://build.aicountly.org/api/v1' }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'AICOUNTLY Build' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Prepare Pages artifact
        working-directory: web/dist
        run: |
          touch .nojekyll
          cp index.html 404.html
          # Ensure deploy-pages can read every file (actions/deploy-pages#58).
          chmod -c -R +rX .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Done
        run: |
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
