name: Deploy Production via SSH

# cPanel layout (mirrors reach-aicountly):
#   web/dist/*     →  ${PROD_SFTP_REMOTE_ROOT}/     (typically public_html/)
#   server-php/*   →  ${PROD_SFTP_REMOTE_ROOT}/api/ (CodeIgniter front controller)
#
# api/.env is NEVER deployed from CI and NEVER modified — existing server .env
# is backed up before api/ is replaced and restored immediately after.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production-build
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_ROOT: ${{ secrets.PROD_SFTP_REMOTE_ROOT }}
      SITE_HOST: build.aicountly.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (web/dist for public_html)
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
        run: |
          # Base URL must end at /api — the SPA client appends /v1/...
          API_URL="${VITE_API_URL:-https://build.aicountly.org/api}"
          API_URL="${API_URL%/}"
          API_URL="${API_URL%/v1}"
          export VITE_API_URL="$API_URL"
          echo "Building with VITE_API_URL=${VITE_API_URL}"
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/.htaccess || cp public/.htaccess dist/.htaccess
          echo "Built $(find dist -type f | wc -l) files in web/dist (→ public_html)"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, curl, pgsql, pdo_pgsql

      - name: Install server-php Composer dependencies (production)
        working-directory: server-php
        run: |
          composer install --no-dev --no-interaction --no-progress --optimize-autoloader --prefer-dist
          test -d vendor/codeigniter4/framework || (echo "CI4 framework missing after composer install" && exit 1)
          echo "vendor/ ready ($(du -sh vendor | cut -f1)) — bundled into api deploy (no server composer needed)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SFTP_HOST }}
          SSH_PORT: ${{ secrets.PROD_SFTP_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host cpanel-prod
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${{ secrets.PROD_SFTP_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            RequestTTY no
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish the single reviewed HTTPS rewrite and verify the production notice
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum web/public/.htaccess | cut -d' ' -f1)" = 257412e9e8d1f55adcb4a732ece39cf4bb01aa678c06db5da1c41ec6c1267ac8
          remote=(ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes cpanel-prod)
          apply() {
            {
              printf 'operation=%q\n' "$1"
              printf 'payload=%q\n' "$(base64 -w0 web/public/.htaccess)"
              cat <<'REMOTE'
          set -euo pipefail
          umask 077
          test "$(id -un)" = buildaicountly
          cd "$HOME/public_html"
          [[ -f .htaccess && ! -L .htaccess && -O .htaccess ]]
          backup="$HOME/.htaccess-before-https-20261118-51d4c7393c3a96e07dac7d1cb3264f0d07d38c77595834a4bbebc1f438b67517"
          if [ "$operation" = install ]; then
            test "$(sha256sum .htaccess | cut -d' ' -f1)" = 51d4c7393c3a96e07dac7d1cb3264f0d07d38c77595834a4bbebc1f438b67517
            if [ ! -e "$backup" ]; then (set -C; cat .htaccess > "$backup"); fi
            [[ -f "$backup" && ! -L "$backup" && -O "$backup" ]]
            test "$(sha256sum "$backup" | cut -d' ' -f1)" = 51d4c7393c3a96e07dac7d1cb3264f0d07d38c77595834a4bbebc1f438b67517
            want=257412e9e8d1f55adcb4a732ece39cf4bb01aa678c06db5da1c41ec6c1267ac8; existing=51d4c7393c3a96e07dac7d1cb3264f0d07d38c77595834a4bbebc1f438b67517
          else
            test "$operation" = restore
            [[ -f "$backup" && ! -L "$backup" && -O "$backup" ]]
            want=51d4c7393c3a96e07dac7d1cb3264f0d07d38c77595834a4bbebc1f438b67517; existing=257412e9e8d1f55adcb4a732ece39cf4bb01aa678c06db5da1c41ec6c1267ac8
          fi
          tmp=$(mktemp .htaccess.https-XXXXXX)
          trap 'rm -f -- "$tmp"' EXIT
          cp --preserve=all -- .htaccess "$tmp"
          if [ "$operation" = install ]; then printf '%s' "$payload" | base64 -d > "$tmp"; else cat "$backup" > "$tmp"; fi
          test "$(sha256sum "$tmp" | cut -d' ' -f1)" = "$want"
          test "$(stat -c '%u:%g:%a' "$tmp")" = "$(stat -c '%u:%g:%a' .htaccess)"
          test "$(sha256sum .htaccess | cut -d' ' -f1)" = "$existing"
          mv -f -- "$tmp" .htaccess
          REMOTE
            } | "${remote[@]}" 'bash -s'
          }
          apply install
          verify() {
            local response code
            for path in / /index.html; do
              response=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "http://build.aicountly.org$path") || return 1
              test "$response" = "301 https://build.aicountly.org$path" || return 1
            done
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/https-notice-page" -w '%{http_code}' https://build.aicountly.org/) || return 1
            test "$code" = 200 && grep -q 'maintenance-notice-20261118' "$RUNNER_TEMP/https-notice-page"
          }
          if ! verify; then apply restore; exit 1; fi
